a;font-size:13px;padding:10px 0}@media(max-width:370px){.wrap{padding:12px}.card{padding:13px}.big{font-size:20px}.row{gap:6px}input[type=number]{width:88px}}

00%,0 100%)}.scratch.stage3{border:0;background:#f7f7f7}.salary-group .pencil{flex-shrink:0}.row .salary-group{max-width:100%}.row>.field>.scratch{width:140px}.gray .row:last-child{margin-bottom:0}.report-scroll{max-height:65vh;overflow-y:auto}svg{max-width:100%;height:auto}button:focus-visible{outline:2px solid #2b865f;outline-offset:2px}.storage-warning{color:#a33}.attachment{max-width:100%;max-height:70vh;object-fit:contain}@media(max-width:370px){.wrap{padding:10px}.card{padding:12px}.gray{padding:11px}.scratch{width:116px;font-size:14px}.salary-group .pencil{font-size:13px;padding:2px}.section-head h2{font-size:15px}.section-head>div{font-size:12px}.row .money{font-size:13px}.row{gap:8px}.row>.field{max-width:65%}.top-summary h2{font-size:17px}.chip{font-size:9px}.sub{font-size:12px}.gray h3{font-size:15px}}
.reconciliation-notes{white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere}.welcome{border-color:#b6cfbf}.welcome .actions{margin-top:10px}</style></head><body><header><div style="font-size:30px">💰</div><div style="text-align:center"><h1>Save Cash</h1><div class="sub">Бюджет до ЗП</div></div><button class="icon" onclick="showSettings()">⚙️</button></header><main class="wrap" id="app"></main><div id="overlay"></div><script src="./model.js"></script><script src="./storage.js"></script><script>
const KEY='save-cash-v2';const TODAY=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let d=CashModel.migrate();let ready=false;let scratchCounter=0;const scratchStates={};let testValue=0;
function save(){d.schemaVersion=2;d.audit_log.push({id:id(),at:new Date().toISOString(),action:'Изменение данных'});d.audit_log=d.audit_log.slice(-300);Storage.save(d).catch(storageError)}
function storageError(e){document.getElementById('storage-state').textContent='Не удалось сохранить: '+e.message+' · экспортируйте JSON';}
const fmt=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₪';const sum=CashModel.total;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID();const cibus=()=>CashModel.cibus(d).amount;const child=()=>CashModel.child(d);const totalSub=()=>sum(d.subs);const purchasesCash=()=>sum(CashModel.unique(d.purchases).filter(x=>x.method==='Счёт'&&CashModel.inPeriod(d,x.date)));const purchasesCard=()=>sum(CashModel.unique(d.purchases).filter(x=>x.method==='Ашрай'&&CashModel.inPeriod(d,x.date)));const planned=()=>sum(d.planned);const holiday=()=>sum(d.holidays);const expenses=()=>CashModel.calculate(d).expenses;const forecast=()=>CashModel.calculate(d).forecast;const free=()=>CashModel.calculate(d).free;const item=(label,value,color='')=>`<div class="row"><span>${label}</span><span class="money ${color}">${fmt(value)}</span></div>`;
function section(key,title,content,total=''){return `<section class="card"><div class="section-head" onclick="toggle('${key}')"><h2>${title}</h2><div><b>${total}</b> <span>${d.open[key]?'⌃':'⌄'}</span></div></div><div class="section-body" ${d.open[key]?'':'hidden'}>${content}</div></section>`}
function editable(key,label){return `<div class="row"><span>${label}</span><div class="field" id="field-${key}"><b class="money display">${fmt(d[key])}</b><input class="edit" type="number" step="0.01" value="${d[key]}" onblur="commit('${key}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="icon" title="Изменить" onclick="edit('${key}')">✎</button></div></div>`}
function editableItem(collection,x){return `<div class="row"><span>${esc(x.name)}${collection==='subs'?`<div class="small">Ориентировочно ${esc(x.day||'—')}-е числа</div><label class="small"><input type="checkbox" ${x.included_in_statement?'checked':''} onchange="included('${x.id}',this.checked)"> В выписке</label>`:''}${x.date?`<div class="small">${esc(x.date)} · ${esc(x.type||'Запланировано')}</div>`:''}</span><div class="field" id="item-${x.id}"><b class="money display">${fmt(x.amount)}</b><input class="edit" type="number" step="0.01" value="${x.amount}" onblur="commitItem('${collection}','${x.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="icon" onclick="editItem('${x.id}')">✎</button>${['planned','holidays'].includes(collection)?`<button class="icon" title="Изменить название и дату" onclick="editRecord('${collection}','${x.id}')">⋯</button>`:''}<button class="icon danger" onclick="removeItem('${collection}','${x.id}')">×</button></div></div>`}
function scratch(){const key='salary-'+scratchCounter++;const stage=scratchStates[key]||0;return `<span class="salary-group"><button class="scratch stage${stage}" aria-label="Защитное покрытие зарплаты" onclick="scratchTap('${key}')"><span class="salary-value">${stage===3?fmt(d.salary):stage?'<span aria-hidden="true">'+fmt(d.salary)+'</span>':'••••••'}</span><span class="coating"></span></button><button class="icon pencil" title="Изменить зарплату" aria-label="Изменить зарплату" onclick="salaryEditTap('${key}')">✎</button></span>`}
function render(){pay='Ашрай';scratchCounter=0;const spent=expenses();const progress=Math.max(0,Math.min(100,100*(Number(d.balance)+Number(d.salary)-spent-Number(d.limit))/Math.max(1,Number(d.salary))));document.getElementById('app').innerHTML=`${!d.initialized?welcomeHTML():''}
<section class="card"><div class="top-summary"><h2>▣ Цель экономии — ${monthName()}</h2><span class="chip">${esc(d.statementStatus)}</span></div><div class="sub">${periodLabel()} · Цель: баланс не ниже ${fmt(d.limit)}</div><div class="grid" style="margin-top:17px"><div><div class="sub">Текущий баланс банка</div><div class="big">${fmt(d.balance)}</div></div><div><div class="sub">Аренда + ${d.loanActive?'последний кредит':'кредит отсутствует'}</div><div class="big">${fmt(Number(d.rent)+(d.loanActive?Number(d.loan):0))}</div></div><div><div class="sub">Зарплата · ${esc(d.salaryDate)}</div><div style="margin-top:7px">${scratch()}</div></div><div><div class="sub">Расчётный запас до цели</div><div class="big ${free()>=0?'green':'red'}">${fmt(free())}</div></div></div><div class="progress"><div style="width:${progress}%"></div></div><div class="row small"><span>Новые покупки: ${fmt(purchasesCash()+purchasesCard())}</span><span class="green">Запас: ${fmt(free())}</span></div><div class="line"></div>${item('Прогноз после всех резервов',forecast(),forecast()>=0?'green':'red')}${item('Целевой предел минуса',d.limit)}<div class="note">Это расчёт по известным статьям, а не подтверждённая доступная сумма. Состав полного ашрая требует сверки. Спорные статьи отмечаются отдельно.</div></section>
<section class="card"><div class="top-summary"><h2>⚙ Цель экономии</h2><button class="icon" onclick="showSettings()">☷</button></div><div class="sub">Расчётный период ${periodLabel()}</div><div class="row"><span>Ожидаемая зарплата</span><div class="field">${scratch()}</div></div></section>
${section('cibus','♜ Cibus',`${numeric('cibusDays','Рабочих дней за период')}${numeric('cibus50','Ваучеры по 50 ₪ · дней')}${numeric('cibusOrdinary','Обычные обеды · дней')}${editable('cibusLunchShare','Личное участие за обед')}<div class="line"></div>${item('40 ₪: '+CashModel.cibus(d).n40+' × 2 ₪',CashModel.cibus(d).n40*2)}${item('50 ₪: '+CashModel.cibus(d).n50+' × 12 ₪',CashModel.cibus(d).n50*12)}${item('Обеды: '+CashModel.cibus(d).ordinary+' × '+fmt(d.cibusLunchShare),CashModel.cibus(d).ordinary*d.cibusLunchShare)}<div class="gray">${item('Моё участие Cibus',cibus())}</div><label class="small"><input type="checkbox" ${d.cibusIncluded?'checked':''} onchange="d.cibusIncluded=this.checked;save();render()"> Уже входит в сумму выписки</label>`,fmt(cibus()))}
${section('child','♧ Алименты и '+esc(d.childName||'ребёнок'),`<div class="gray"><h3>Обязательные платежи</h3>${editable('childSupport','Основные алименты')}${editable('math','Учитель математики')}${item('Всего начислено',Number(d.childSupport)+Number(d.math))}</div><div class="gray"><h3>Компенсационный вычет</h3>${editable('hebrewOffset','Компенсация за иврит (−)')}${item('Компенсационный вычет',-d.hebrewOffset,'green')}</div><div class="gray"><div class="row"><h3>Дополнительные расходы</h3><button class="compact" onclick="addItem('extra')">＋</button></div>${d.extra.map(x=>editableItem('extra',x)).join('')}${item('Всего дополнительно',sum(d.extra))}</div><div class="gray">${item('К перечислению и оплате',child(),'green')}</div>`,fmt(child()))}
${section('subs','↻ Ежемесячные абонплаты',`${d.subs.map(x=>editableItem('subs',x)).join('')}<button class="compact" onclick="addItem('subs')">＋ Добавить абонплату</button><div class="line"></div>${item('Всего абонплат',totalSub())}`,fmt(totalSub()))}
${section('installments','▤ Рассрочки и будущие списания',installmentsHTML(),fmt(sum(d.installments.filter(x=>x.active&&x.status==='Подтверждено').map(x=>({amount:x.amount_per_payment})))))}
${section('holidays','🎁 Праздничные покупки',`${d.holidays.map(x=>editableItem('holidays',x)).join('')}<button class="compact" onclick="addItem('holidays')">＋ Добавить праздник</button><div class="line"></div>${item('Всего запланировано',holiday())}`,fmt(holiday()))}
${section('planned','◷ Запланированные покупки',`${d.planned.map(x=>editableItem('planned',x)).join('')}<button class="compact" onclick="addItem('planned')">＋ Запланировать покупку</button><div class="line"></div>${item('Всего запланировано',planned())}`,fmt(planned()))}
${section('purchases','🛒 Журнал новых покупок',`<div class="form-row"><label>Что куплено / магазин</label><div class="field"><input id="shop" style="flex:1;width:100%" placeholder="Например, продукты в Шуферсаль" oninput="suggest(this.value)"><button class="compact" onclick="selectReceipt(false)" title="Прикрепить фото чека">▧</button><button class="compact" onclick="selectReceipt(true)" title="Снять чек">▣</button><input id="receiptFile" type="file" accept="image/*" hidden onchange="attachReceipt(this.files[0])"></div><div id="receiptNotice" class="small"></div><div id="suggestions" class="suggestions"></div></div><div class="two"><div class="form-row"><label>Сумма, ₪</label><input id="amount" type="number" step="0.01" placeholder="0,00"></div><div class="form-row"><label>Дата покупки</label><input id="date" type="date" value="${TODAY()}"></div></div><div class="form-row"><label>Категория</label><button id="categoryChoice" class="compact" onclick="categoryTap()">Выбери категорию</button><select id="category" hidden onchange="categorySelected()"><option value="">Выбери категорию</option>${['Продукты','Рестораны','Развлечения','Дети','Дом','Одежда','Транспорт','Ненужные покупки','Здоровье','Другое'].map(x=>`<option>${x}</option>`).join('')}</select><input id="customCategory" hidden style="margin-top:6px" placeholder="Или введи свою категорию"></div><div class="form-row"><label>Способ оплаты</label><div class="actions"><button id="pay-card" class="primary compact" onclick="choosePay('Ашрай')">Ашрай</button><button id="pay-cash" class="compact" onclick="choosePay('Счёт')">Счёт</button></div></div><div class="form-row"><label>Статус</label><select id="status"><option>Совершено</option><option>Запланировано</option><option>Включено в выписку</option><option>Списано со счёта</option></select></div><button class="primary" style="width:100%" onclick="addPurchase()">＋ Добавить покупку</button><div class="line"></div><div class="row"><b>Покупки</b><button class="compact" onclick="toggle('report')">${d.open.report?'Свернуть':'Открыть лог-отчёт'}</button></div>${d.open.report?'<div class="report-scroll">'+reportHTML()+'</div>':''}`,fmt(purchasesCash()+purchasesCard()))}
<section class="card">${editable('reserve','Резерв банковских рисков')}${editable('limit','Целевой предел минуса')}</section>
${section('forecast','▣ Итоговый прогноз',`${editable('balance','Остаток на счёте · исходный')}<div class="row"><span>Ожидаемая зарплата</span><div class="field">${scratch()}</div></div>${item('Ашрай октября · уже в исходном балансе',d.ashrai)}<div class="small">Повторно не вычитается. Ноябрьская сумма частичная; проверьте полноту выписки.</div>${editable('statementTotal','Ашрай периода · сумма выписки')}<div class="row"><span class="small">Статус выписки</span><button class="compact" onclick="changeStatementStatus()">${esc(d.statementStatus)} ✎</button></div>${dateField('statementDate','Дата списания ашрая')}${d.loanActive?editable('loan','Последний платёж по кредиту'):''}<button class="compact" onclick="set('loanActive',${!d.loanActive})">${d.loanActive?'− Убрать кредит':'＋ Вернуть последний кредит'}</button>${dateField('loanDate','Дата последнего кредита')}
${editable('rent','Аренда')}${dateField('rentDate','Дата списания аренды')}${item('Алименты и ребёнок',-child())}${item('Cibus',-cibus())}${item('Абонплаты · детализация',-totalSub())}<div class="small">Статьи с отметкой «в выписке» повторно не вычитаются. Итог по постатейной сверке ниже.</div>${item('Праздники и покупки',-holiday())}${item('Запланированные',-planned())}${item('Новые покупки по ашраю',-purchasesCard())}${item('Новые покупки со счёта',-purchasesCash())}${item('Резерв',-d.reserve)}<div class="line"></div>${item('Прогноз после расходов',forecast(),forecast()>=0?'green':'red')}${item('Баланс при использовании целевого лимита',d.limit)}<div class="gray">${item('Запас до целевого предела',free(),free()>=0?'green':'red')}</div><div class="small">Расчётная версия. Полноту выписки и спорные статьи необходимо сверить. Подписки и Cibus — прогноз сверх выписки, пока не отмечены включёнными.</div>`,fmt(forecast()))}
<section class="card"><h2>▣ Проверка влияния новой покупки</h2><div class="row"><span>Стоимость покупки</span><div class="field" id="field-test"><b class="money display">${fmt(testValue)}</b><input class="edit" type="number" id="testCost" value="${testValue}" min="0" oninput="testImpact()" onblur="render()"><button class="icon" onclick="edit('test')">✎</button></div></div><div id="impact" class="gray">Запас после покупки: <b>${fmt(free()-testValue)}</b></div><div class="small">Проверка не записывает покупку в журнал.</div></section>

function reportHTML(){let cats={};for(let x of CashModel.unique(d.purchases).filter(x=>CashModel.inPeriod(d,x.date))){(cats[x.category||'Другое']??=[]).push(x)}return `<div class="actions"><button class="compact" onclick="document.querySelectorAll('.cat').forEach(x=>x.open=true)">Развернуть все</button><button class="compact" onclick="document.querySelectorAll('.cat').forEach(x=>x.open=false)">Свернуть все</button></div><div class="gray">${item('Обязательные платежи',Number(d.rent)+(d.loanActive?Number(d.loan):0))}${item('Алименты и ребёнок',child())}${item('Абонплаты',totalSub())}</div>${Object.entries(cats).map(([name,items])=>`<details class="cat"><summary><b>${esc(name)} · ${fmt(sum(items))}</b></summary>${items.map(x=>`<div class="purchase row"><span>${esc(x.name)}<div class="small">${esc(x.date)} · ${esc(x.method)} · ${esc(x.status)}</div>${x.attachment?`<button class="compact" onclick="viewReceipt('${x.id}')">Чек</button>`:''}</span><div class="field"><b>${fmt(x.amount)}</b><button class="icon" onclick="editPurchase('${x.id}')">✎</button><button class="icon danger" onclick="removeItem('purchases','${x.id}')">×</button></div></div>`).join('')}</details>`).join('')||'<div class="empty">Покупок пока нет</div>'}`}
function toggle(k){d.open[k]=!d.open[k];save();render()}function set(k,v){d[k]=typeof d[k]==='boolean'?Boolean(v):Number(v)||0;save();render()}function edit(k){const e=document.getElementById('field-'+k);if(!e)return;e.classList.add('editing');e.querySelector('input')?.focus()}function commit(k,v){const n=Number(v);if(!Number.isFinite(n)||(!['limit','balance'].includes(k)&&n<0)){render();return}d[k]=n;if(k.startsWith('cibus')){const c=CashModel.cibus(d);d.cibusDays=c.days;d.cibus50=c.n50;d.cibusOrdinary=c.ordinary;}save();render()}function editItem(id){const e=document.getElementById('item-'+id);e.classList.add('editing');e.querySelector('input').focus()}function commitItem(c,id,v){if(!Number.isFinite(Number(v))||Number(v)<0){render();return}let x=d[c].find(x=>x.id===id);if(x)x.amount=Number(v)||0;save();render()}function removeItem(c,id){confirmSmall('Удалить запись?',()=>{d[c]=d[c].filter(x=>x.id!==id);save();render()})}function addItem(c){const names={extra:'Дополнительный расход',subs:'Абонплата',holidays:'Праздничная покупка',planned:'Запланированная покупка'};let opts=c==='holidays'?`<select id="modalType"><option>День рождения</option><option>Новый год</option><option>Особая дата</option><option>Другое</option></select>`:'';modal(`<h3>${names[c]}</h3>${opts}<div class="form-row"><label>Название</label><input id="modalName" placeholder="Название" style="width:100%"></div><div class="form-row"><label>Сумма, ₪</label><input id="modalAmount" type="number" value="0" style="width:100%"></div>${['planned','holidays'].includes(c)?`<div class="form-row"><label>Дата</label><input type="date" id="modalDate" value="${TODAY()}"></div>`:''}<div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="saveItem('${c}')">Добавить</button></div>`)}function saveItem(c){if(!(Number(document.getElementById('modalAmount').value)>=0)||!Number.isFinite(Number(document.getElementById('modalAmount').value)))return;const name=document.getElementById('modalName').value.trim()||document.getElementById('modalType')?.value||'Без названия';d[c].push({id:id(),name,amount:Number(document.getElementById('modalAmount').value)||0,date:document.getElementById('modalDate')?.value,type:document.getElementById('modalType')?.value,source:'Ручной ввод',included_in_statement:false});save();closeModal();render()}function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function confirmSmall(title,yes){window._confirm=yes;modal(`<h3>${title}</h3><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="closeModal();window._confirm()">Подтвердить</button></div>`)}let pay='Ашрай';function choosePay(v){if(v==='Счёт'){confirmSmall('Подтвердить оплату со счёта?',()=>{pay=v;document.getElementById('pay-cash').classList.add('primary');document.getElementById('pay-card').classList.remove('primary')})}else{pay=v;document.getElementById('pay-card').classList.add('primary');document.getElementById('pay-cash').classList.remove('primary')}}const shops=['Шуферсаль','Shufersal','Tiv Taam','Тив Таам','TIFF','Super-Pharm','Супер-Фарм','Rami Levy','Рами Леви','Victory','Виктори','Yochananof','Йохананоф','AM:PM','Арома','Aroma','Макдональдс','McDonald’s','KSP','IKEA','Икеа','Fox','H&M','ZARA','BESTEC','Gold Love'];function suggest(v){let q=v.toLowerCase().trim();document.getElementById('suggestions').innerHTML=q?shops.filter(x=>x.toLowerCase().includes(q)||q==='тив'&&x==='Tiv Taam').slice(0,5).map(x=>`<button onclick="document.getElementById('shop').value='${x}';suggest('')">${x}</button>`).join(''):''}function addPurchase(){const name=document.getElementById('shop').value.trim(),amount=Number(document.getElementById('amount').value),date=document.getElementById('date').value,category=document.getElementById('customCategory').value.trim()||document.getElementById('category').value,status=document.getElementById('status').value;if(!name||!(amount>0)||!Number.isFinite(amount)||!date||!category){modal('<h3>Заполни название, сумму и категорию</h3><button onclick="closeModal()">Закрыть</button>');return}const entry={id:id(),name,amount,date,category,method:pay,status,attachment:draftAttachment,source:'Ручной ввод',included_in_statement:pay==='Ашрай'&&['Включено в выписку','Списано со счёта'].includes(status),charge_date:CashModel.chargeDate({date,method:pay},d)};if(status==='Запланировано')d.planned.push(entry);else d.purchases.push(entry);draftAttachment=null;save();render()}function scratchTap(key){scratchStates[key]=((scratchStates[key]||0)+1)%4;render()}const editTaps={};function salaryEditTap(key){const now=Date.now();if(!editTaps[key]||now-editTaps[key]>1800){editTaps[key]=now;return}editTaps[key]=0;confirmSmall('Открыть редактирование зарплаты?',()=>modal(`<h3>Изменить ожидаемую зарплату</h3><input id="newSalary" type="number" style="width:100%" value="${d.salary}"><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="saveSalary()">Сохранить</button></div>`))}function testImpact(){let v=Math.max(0,Number(document.getElementById('testCost').value)||0);testValue=v;document.getElementById('impact').innerHTML=`Запас после покупки: <b class="${free()-v>=0?'green':'red'}">${fmt(free()-v)}</b><div class="small">Изменение прогноза: −${fmt(v)}</div>`}function resetPanel(){modal(`<h3>Настройки расчёта</h3><div class="small">Сброс изменяет исходные параметры. Покупки и журнал остаются без изменений.</div><div class="form-row"><label>Зарплата, ₪</label><input type="number" id="resetSalary" value="${d.initial_parameters?.salary??0}" style="width:100%"></div><div class="form-row"><label>Целевой минус, ₪</label><input type="number" id="resetLimit" value="${d.initial_parameters?.limit??0}" style="width:100%"></div><div class="form-row"><label>Компенсация за иврит, ₪</label><input type="number" id="resetHebrew" value="${d.initial_parameters?.hebrewOffset??0}" style="width:100%"></div><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="compact danger" onclick="resetConfirm()">Сбросить параметры</button></div>`)}function resetConfirm(){const a=Number(document.getElementById('resetSalary').value),b=Number(document.getElementById('resetLimit').value),c=Number(document.getElementById('resetHebrew').value);confirmSmall('Подтвердить сброс выбранных параметров?',()=>{const old={salary:d.salary,limit:d.limit,hebrewOffset:d.hebrewOffset};d.lastReset=old;if(![a,b,c].every(Number.isFinite)||a<0||c<0)return;d.salary=a;d.limit=b;d.hebrewOffset=c;d.salaryStep=0;save();render();modal(`<h3>Параметры обновлены</h3><div class="small">Можно отменить последний сброс.</div><div class="actions"><button class="compact" onclick="closeModal()">Закрыть</button><button class="primary compact" onclick="d.salary=${old.salary};d.limit=${old.limit};d.hebrewOffset=${old.hebrewOffset};save();closeModal();render()">Отменить сброс</button></div>`)})}
function monthName(){return new Date(d.periodEnd+'T12:00:00').toLocaleDateString('ru-RU',{month:'long'})}
function periodLabel(){return [d.periodStart,d.periodEnd].map(x=>x.split('-').reverse().join('.')).join('–')}
function numeric(key,label){return editable(key,label).replace(fmt(d[key])+'</b>',String(d[key])+'</b>')}
function dateField(key,label){return `<div class="row"><span>${label}</span><span class="field"><b class="small">${esc(d[key])}</b><button class="icon" onclick="editDate('${key}')">✎</button></span></div>`}
function editDate(key){modal(`<h3>Изменить дату</h3><input type="date" id="newDate" value="${esc(d[key])}"><div class="actions"><button onclick="closeModal()">Отмена</button><button onclick="saveDate('${key}')">Сохранить</button></div>`)}
function saveDate(key){const date=document.getElementById('newDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;if(key==='periodStart'&&date>=d.periodEnd||key==='periodEnd'&&date<=d.periodStart)return;d[key]=date;save();closeModal();render()}
function included(key,value){d.subs.find(x=>x.id===key).included_in_statement=value;save();render()}
function installmentsHTML(){return `<div class="small">Входящие в выписку строки не вычитаются повторно. Для каждой рассрочки проверьте дату и статус.</div>${d.installments.map(x=>`<div class="purchase"><div class="row"><span><b>${esc(x.merchant)}</b><div class="small">${x.payment_index} из ${x.payment_count} · ${esc(x.expected_charge_date)}</div></span><span class="field"><b class="money">${fmt(x.amount_per_payment)}</b><button class="icon" onclick="editInstallment('${x.id}')">✎</button></span></div><div class="small">${esc(x.status)} · ${esc(x.source)}<br>После этого платежа: ${Math.max(0,x.payment_count-x.payment_index)} × ${fmt(x.amount_per_payment)} = ${fmt(CashModel.remaining(x))}</div><label class="small"><input type="checkbox" ${x.included_in_statement?'checked':''} onchange="setInstallment('${x.id}','included_in_statement',this.checked)"> Входит в сумму выписки</label> <label class="small"><input type="checkbox" ${x.active?'checked':''} onchange="setInstallment('${x.id}','active',this.checked)"> Учитывать</label></div>`).join('')}<button class="compact" onclick="editInstallment()">＋ Добавить рассрочку</button>`}
function setInstallment(key,field,value){d.installments.find(x=>x.id===key)[field]=value;save();render()}
function editInstallment(key){let x=d.installments.find(x=>x.id===key)||{merchant:'',amount_per_payment:0,payment_index:1,payment_count:1,expected_charge_date:d.statementDate,status:'Требует сверки'};modal(`<h3>Рассрочка</h3><div class="form-row"><label>Продавец</label><input id="instMerchant" value="${esc(x.merchant)}"></div><div class="form-row"><label>Платёж, ₪</label><input id="instAmount" type="number" min="0" step=".01" value="${x.amount_per_payment}"></div><div class="two"><div class="form-row"><label>Номер платежа</label><input id="instIndex" type="number" min="1" value="${x.payment_index}"></div><div class="form-row"><label>Всего платежей</label><input id="instCount" type="number" min="1" value="${x.payment_count}"></div></div><div class="form-row"><label>Дата списания</label><input id="instDate" type="date" value="${x.expected_charge_date}"></div><div class="form-row"><label>Статус</label><select id="instStatus"><option ${x.status==='Требует сверки'?'selected':''}>Требует сверки</option><option ${x.status==='Подтверждено'?'selected':''}>Подтверждено</option></select></div><div class="actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveInstallment('${key||''}')">Сохранить</button></div>`)}
function saveInstallment(key){let merchant=document.getElementById('instMerchant').value.trim(),amount=Number(document.getElementById('instAmount').value),index=Number(document.getElementById('instIndex').value),count=Number(document.getElementById('instCount').value),date=document.getElementById('instDate').value;if(!merchant||amount<0||!Number.isFinite(amount)||!Number.isInteger(index)||!Number.isInteger(count)||index<1||count<index||!date)return;let x=d.installments.find(x=>x.id===key);if(!x){x={id:id(),active:true,included_in_statement:false,source:'Ручной ввод'};d.installments.push(x)}Object.assign(x,{merchant,amount_per_payment:amount,payment_index:index,payment_count:count,expected_charge_date:date,status:document.getElementById('instStatus').value});save();closeModal();render()}
function reconciliationHTML(){const c=CashModel.calculate(d);return `<div class="small">Расчётная версия. Проверяйте полноту выписки, даты и отметки включения. Баланс относится к дате снимка. Уже списанный ашрай не вычитается повторно.</div><div class="table-scroll"><table><thead><tr><th>Статья</th><th>Сумма</th><th>Источник</th><th>Инструмент</th><th>Дата операции</th><th>Дата списания</th><th>Уже учтена / вне периода?</th><th>Статус</th></tr></thead><tbody>${c.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.amount)}</td><td>${esc(x.source)}</td><td>${esc(x.method)}</td><td>${esc(x.operation_date)}</td><td>${esc(x.date)}</td><td>${x.included?'Да · повторно 0,00 ₪':'Нет · учесть'}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>${item('Прогноз по выбранным статьям',c.forecast)}${item('Запас до цели · расчётная версия',c.free)}${d.reconciliation_notes?`<details class="gray"><summary>Сверка исходного пакета</summary><div class="reconciliation-notes">${esc(d.reconciliation_notes)}</div></details>`:''}<button class="compact" onclick="exportLedger()">Скачать сверку CSV</button>`}

function chartHTML(){let selected=d.history.filter(x=>d.selectedPeriods.includes(x.id)),colors=['#15825a','#4f75ae','#b16b30'];const saving=CashModel.saving(d);return `<div class="small">Дневных операций нет. На графике показаны только известные итоги на конец периода, без выдуманных кривых.</div><div class="actions">${d.history.map(x=>`<button class="compact ${d.selectedPeriods.includes(x.id)?'primary':''}" onclick="togglePeriod('${x.id}')">${esc(x.name)}</button>`).join('')}</div><svg viewBox="0 0 340 180" role="img" aria-label="Известные итоги периодов"><path d="M35 15V145H320" stroke="#bbb" fill="none"/><text x="35" y="169" font-size="11">15-е · начало</text><text x="240" y="169" font-size="11">15-е · конец</text>${selected.map((x,i)=>`<circle cx="${275+i*14}" cy="${140-Number(x.total)/8000*110}" r="5" fill="${colors[i]}"/><text x="42" y="${22+i*20}" fill="${colors[i]}" font-size="12">${esc(x.name)}: ${fmt(x.total)}</text>`).join('')}</svg>${selected.length===2?item('Разница выбранных итогов',selected[1].total-selected[0].total):'<div class="small">Выберите два периода для сравнения.</div>'}<div class="gray">${editable('previousSpending','Траты сравнительного периода')}${editable('savingGoal','Цель сокращения трат')}${editable('comparedSpending','Сценарий трат · требует сверки')}${item('Предел расходов',saving.ceiling)}${item('Превышение',saving.excess,'red')}${item('Требуемая экономия следующего периода',saving.nextGoal)}<button class="compact" onclick="carryExcess()">Перенести превышение в следующий период</button></div>`}
function togglePeriod(key){d.selectedPeriods=d.selectedPeriods.includes(key)?d.selectedPeriods.filter(x=>x!==key):[...d.selectedPeriods,key];save();render()}
function carryExcess(){confirmSmall('Сохранить перенос для следующего периода?',()=>{d.nextPeriodCarry=CashModel.saving(d).excess;save();modal(`<h3>Перенос сохранён</h3><p>При открытии следующего периода требуемая экономия увеличится на ${fmt(d.nextPeriodCarry)}.</p><button onclick="closeModal()">Закрыть</button>`)})}
function download(name,type,contents){const url=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportData(){await Storage.flush();download('Save-Cash-backup-'+TODAY()+'.json','application/json',JSON.stringify({app:'Save Cash',schemaVersion:2,exportedAt:new Date().toISOString(),data:d},null,2))}
function exportLedger(){const rows=CashModel.calculate(d).rows;const cells=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('Save-Cash-reconciliation.csv','text/csv;charset=utf-8','\ufeff'+[['Статья','Сумма ₪','Источник','Инструмент','Дата операции','Дата списания','Учтена / вне периода','Статус'],...rows.map(x=>[x.name,x.amount,x.source,x.method,x.operation_date,x.date,x.included?'Да':'Нет',x.status])].map(r=>r.map(cells).join(';')).join('\r\n'))}
function validData(raw){const v=raw?.data||raw;if(!v||v.schemaVersion!==2||!Array.isArray(v.purchases)||!Array.isArray(v.subs)||!Array.isArray(v.installments))throw new Error('Нужна резервная копия Save Cash v2');for(const key of ['balance','salary','limit','rent','loan','statementTotal'])if(typeof v[key]!=='number'||!Number.isFinite(v[key]))throw new Error('Некорректное число '+key);const out=CashModel.migrate(v);for(const key of ['purchases','subs','installments','extra','planned','holidays','audit_log','history']){if(!Array.isArray(out[key]))throw new Error('Некорректный список '+key);const ids=new Set;for(const x of out[key]){if(!x||typeof x.id!=='string'||!/^[\w-]+$/.test(x.id)||ids.has(x.id))throw new Error('Некорректный или повторный ID');ids.add(x.id);const amount=x.amount??x.amount_per_payment;if(amount!==undefined&&(typeof amount!=='number'||!Number.isFinite(amount)||amount<0))throw new Error('Некорректная сумма')}}return out}
async function importData(file){if(!file)return;try{const v=validData(JSON.parse(await file.text()));confirmSmall('Восстановить данные из копии? Текущие данные сохранятся в резервной копии.',async()=>{try{await Storage.flush();await Storage.backup('before-import',d);await exportData();d=v;d.initialized=true;save();closeModal();render()}catch(e){storageError(e)}})}catch(e){modal('<h3>Импорт не выполнен</h3><p>'+esc(e.message)+'</p><button onclick="closeModal()">Закрыть</button>')}}
function showSettings(){modal(`<h3>Save Cash <span class="pill">v2.1</span></h3><p class="small">Бюджет до ЗП · личное использование</p><div class="gray">© 2026 Anton Koval. Все права защищены. Для личного использования.</div><div class="stack"><button onclick="installApp()">Установить приложение</button><button onclick="checkUpdate()">Проверить обновление</button><button onclick="exportData()">Экспорт / резервная копия JSON</button><label class="compact">Восстановить JSON <input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></label><button onclick="showPeriodSettings()">Расчётный период и даты</button><button onclick="resetPanel()">Сбросить к исходному прогнозу…</button>${d.lastReset?'<button onclick="undoReset()">Отменить последний сброс</button>':''}<button onclick="closeModal()">Закрыть</button></div><p class="small">Фото чеков: можно прикрепить изображение, суммы вводятся вручную. Автоматическое распознавание не подключено.</p>`)}
function showPeriodSettings(){modal(`<h3>Период и даты</h3><button class="compact" onclick="openNextPeriod()">Открыть следующий период</button>${dateField('periodStart','Начало периода')}${dateField('periodEnd','Конец периода')}${dateField('balanceDate','Баланс на дату')}${dateField('salaryDate','Зарплата')}${dateField('childDate','Алименты')}<p class="small">Баланс должен включать все уже проведённые списания на указанную дату. Для нового периода обновите баланс, выписку и даты обязательств. Последний кредит не переносится автоматически.</p><button onclick="closeModal()">Закрыть</button>`)}
function openNextPeriod(){confirmSmall('Перейти в следующий период? Текущий снимок будет сохранён. Обновите банковский баланс после перехода.',async()=>{try{await Storage.backup('before-period-change',d);const start=new Date(d.periodEnd+'T12:00:00Z');start.setUTCDate(start.getUTCDate()+1);const end=new Date(d.periodEnd+'T12:00:00Z');end.setUTCMonth(end.getUTCMonth()+1);d.periodStart=start.toISOString().slice(0,10);d.periodEnd=end.toISOString().slice(0,10);d.carry=Number(d.nextPeriodCarry||0);d.nextPeriodCarry=0;d.statementTotal=0;d.statementStatus='Частичная выписка';d.statementDate=d.periodEnd;for(const x of d.subs)x.included_in_statement=false;d.cibusIncluded=false;d.salaryDate=d.periodEnd.slice(0,8)+'07';d.rentDate=d.periodEnd;d.childDate=d.periodEnd.slice(0,8)+'01';d.loanActive=false;for(const x of d.installments)if(x.expected_charge_date<d.periodStart&&x.active){const delta=(+d.periodEnd.slice(0,4)-+x.expected_charge_date.slice(0,4))*12+(+d.periodEnd.slice(5,7)-+x.expected_charge_date.slice(5,7));x.payment_index+=delta;x.expected_charge_date=d.periodEnd;x.included_in_statement=false;if(x.payment_index>x.payment_count){x.active=false;x.payment_index=x.payment_count}}save();closeModal();render()}catch(e){storageError(e)}})}
function undoReset(){Object.assign(d,d.lastReset);delete d.lastReset;save();closeModal();render()}
let swRegistration;let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});async function installApp(){if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else modal('<h3>Установка на Android</h3><p>Откройте опубликованную HTTPS-ссылку в Chrome → ⋮ → «Установить приложение» или «Добавить на главный экран».</p><button onclick="closeModal()">Закрыть</button>')}
async function start(){document.getElementById('app').innerHTML='<section class="card">Открываем ваши данные…</section>';try{d=CashModel.migrate(await Storage.load());await Storage.save(d);ready=true;render();}catch(e){document.getElementById('app').innerHTML='<section class="card">Не удалось открыть хранилище. Данные не перезаписаны. '+esc(e.message)+'</section>'}}

let categoryClicks=0;
function categoryTap(){const select=document.getElementById('category'),custom=document.getElementById('customCategory');categoryClicks++;if(categoryClicks===1){select.hidden=false;custom.hidden=true;select.focus()}else{select.hidden=true;custom.hidden=false;custom.focus();categoryClicks=0}}
function categorySelected(){const select=document.getElementById('category');document.getElementById('categoryChoice').textContent=select.value||'Выбери категорию';select.hidden=true;categoryClicks=0}
document.addEventListener?.('click',e=>{if(!['category','categoryChoice','customCategory'].includes(e.target.id)){const select=document.getElementById('category');if(select)select.hidden=true;const custom=document.getElementById('customCategory');if(custom)custom.hidden=true;categoryClicks=0}});
function saveSalary(){const n=Number(document.getElementById('newSalary').value);if(!Number.isFinite(n)||n<0)return;d.salary=n;Object.keys(scratchStates).forEach(k=>scratchStates[k]=0);save();closeModal();render()}
function changeStatementStatus(){modal(`<h3>Статус выписки</h3><div class="stack">${['Частичная выписка','Полная выписка · сверена'].map(status=>`<button onclick="setStatementStatus('${status}')">${status}</button>`).join('')}<button onclick="closeModal()">Отмена</button></div><p class="small">При полной выписке отметьте входящие в неё подписки, рассрочки, Cibus и покупки.</p>`)}
async function checkUpdate(){try{if(!swRegistration){modal('<h3>Обновление пока недоступно</h3><p>Нужно открыть приложение по HTTPS и дождаться регистрации офлайн-режима.</p><button onclick="closeModal()">Закрыть</button>');return}await swRegistration.update();if(swRegistration.waiting)confirmSmall('Обновить приложение? Сначала сохраним данные.',async()=>{await Storage.flush();swRegistration.waiting.postMessage('ACTIVATE_UPDATE');window.location.reload()});else modal('<h3>Проверка завершена</h3><p>Если обновление загружается, оно применится при следующем открытии приложения.</p><button onclick="closeModal()">Закрыть</button>')}catch(e){modal('<h3>Не удалось проверить обновление</h3><p>'+esc(e.message)+'</p><button onclick="closeModal()">Закрыть</button>')}}
function setStatementStatus(status){d.statementStatus=status;save();closeModal();render()}
function welcomeHTML(){return '<section class="card welcome"><h2>Добро пожаловать в Save Cash</h2><p class="small">Загрузите свою резервную копию JSON. Данные сохраняются только на этом устройстве и не отправляются на GitHub.</p><label class="compact">Загрузить JSON <input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label><div class="actions"><button class="compact" onclick="d.initialized=true;save();render()">Начать с пустого бюджета</button></div></section>'}
let draftAttachment=null;
function selectReceipt(camera){const input=document.getElementById('receiptFile');if(camera)input.setAttribute('capture','environment');else input.removeAttribute('capture');input.click()}
function attachReceipt(file){if(!file)return;if(!file.type.startsWith('image/')||file.size>3*1024*1024){modal('<h3>Выберите изображение до 3 МБ</h3><button onclick="closeModal()">Закрыть</button>');return}const r=new FileReader();r.onload=()=>{draftAttachment=r.result;document.getElementById('receiptNotice').textContent='Чек прикреплён. Название, дату и сумму заполните вручную.'};r.readAsDataURL(file)}
function viewReceipt(key){const x=d.purchases.find(x=>x.id===key);if(x?.attachment&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(x.attachment))modal('<img class="attachment" src="'+esc(x.attachment)+'" alt="Прикреплённый чек"><button onclick="closeModal()">Закрыть</button>')}
function editRecord(collection,key){const x=d[collection].find(x=>x.id===key);modal(`<h3>Изменить запись</h3><div class="form-row"><label>Название</label><input id="recordName" value="${esc(x.name)}"></div><div class="form-row"><label>Дата</label><input id="recordDate" type="date" value="${esc(x.date||TODAY())}"></div><div class="actions"><button onclick="closeModal()">Отмена</button><button onclick="saveRecord('${collection}','${key}')">Сохранить</button>${collection==='planned'?`<button onclick="payPlanned('${key}')">Покупка совершена</button>`:''}</div>`)}
function saveRecord(collection,key){const x=d[collection].find(x=>x.id===key);x.name=document.getElementById('recordName').value.trim()||x.name;x.date=document.getElementById('recordDate').value||x.date;save();closeModal();render()}
function payPlanned(key){const x=d.planned.find(x=>x.id===key);if(x.transaction_id)return;const transaction={...x,id:id(),category:'Другое',method:'Ашрай',status:'Совершено',source:'Из плана'};x.transaction_id=transaction.id;d.purchases.push(transaction);save();closeModal();render()}
function editPurchase(key){const x=d.purchases.find(x=>x.id===key);modal(`<h3>Покупка</h3><div class="form-row"><label>Название</label><input id="editName" value="${esc(x.name)}"></div><div class="form-row"><label>Сумма</label><input id="editAmount" type="number" value="${x.amount}" step=".01" min="0"></div><div class="form-row"><label>Дата покупки</label><input id="editDate" type="date" value="${esc(x.date)}"></div><div class="form-row"><label>Дата списания</label><input id="editCharge" type="date" value="${esc(CashModel.chargeDate(x,d))}"></div><div class="form-row"><label>Статус</label><select id="editStatus">${['Совершено','Включено в выписку','Списано со счёта'].map(status=>`<option ${x.status===status?'selected':''}>${status}</option>`).join('')}</select></div><div class="form-row"><label>Связь с рассрочкой или подпиской</label><select id="editLink"><option value="">Нет</option>${d.installments.map(i=>`<option value="${i.id}" ${x.installment_id===i.id?'selected':''}>${esc(i.merchant)}</option>`).join('')}${d.subs.map(i=>`<option value="${i.id}" ${x.recurring_id===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div><div class="actions"><button onclick="closeModal()">Отмена</button><button onclick="savePurchase('${key}')">Сохранить</button></div>`)}
function savePurchase(key){const x=d.purchases.find(x=>x.id===key),amount=Number(document.getElementById('editAmount').value);if(!Number.isFinite(amount)||amount<=0)return;Object.assign(x,{name:document.getElementById('editName').value.trim()||x.name,amount,date:document.getElementById('editDate').value,charge_date:document.getElementById('editCharge').value,status:document.getElementById('editStatus').value,installment_id:document.getElementById('editLink').value.startsWith('sub-')?'':document.getElementById('editLink').value,recurring_id:document.getElementById('editLink').value.startsWith('sub-')?document.getElementById('editLink').value:''});x.included_in_statement=x.method==='Ашрай'&&['Включено в выписку','Списано со счёта'].includes(x.status);save();closeModal();render()}
start();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").then(r=>swRegistration=r).catch(e=>{const n=document.getElementById("storage-state");if(n)n.textContent="Офлайн-режим недоступен: "+e.message}))}</script></body></html>
