const KEY='save-cash-v2';const TODAY=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let d=CashModel.migrate();let ready=false;let scratchCounter=0;const scratchStates={};let testValue=0;
function save(){d.schemaVersion=2;d.audit_log.push({id:id(),at:new Date().toISOString(),action:'Изменение данных'});d.audit_log=d.audit_log.slice(-300);Storage.save(d).catch(storageError)}
function storageError(e){document.getElementById('storage-state').textContent='Не удалось сохранить: '+e.message+' · экспортируйте JSON';}
const fmt=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₪';const sum=CashModel.total;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID();const cibus=()=>CashModel.cibus(d).amount;const child=()=>CashModel.child(d);const totalSub=()=>sum(d.subs);const purchasesCash=()=>sum(CashModel.unique(d.purchases).filter(x=>x.method==='Счёт'&&CashModel.inPeriod(d,x.date)));const purchasesCard=()=>sum(CashModel.unique(d.purchases).filter(x=>x.method==='Ашрай'&&CashModel.inPeriod(d,x.date)));const planned=()=>sum(d.planned);const holiday=()=>sum(d.holidays);const expenses=()=>CashModel.calculate(d).expenses;const forecast=()=>CashModel.calculate(d).forecast;const free=()=>CashModel.calculate(d).free;const item=(label,value,color='')=>`<div class="row"><span>${label}</span><span class="money ${color}">${fmt(value)}</span></div>`;
function section(key,title,content,total=''){return `<section class="card"><div class="section-head" onclick="toggle('${key}')"><h2>${title}</h2><div><b>${total}</b> <span>${d.open[key]?'⌃':'⌄'}</span></div></div><div class="section-body" ${d.open[key]?'':'hidden'}>${content}</div></section>`}
function editable(key,label){return `<div class="row"><span>${label}</span><div class="field" id="field-${key}"><b class="money display">${fmt(d[key])}</b><input class="edit" type="number" step="0.01" value="${d[key]}" onblur="commit('${key}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="icon" title="Изменить" onclick="edit('${key}')">✎</button></div></div>`}
function editableItem(collection,x){return `<div class="row"><span>${esc(x.name)}${collection==='subs'?`<div class="small">Ориентировочно ${esc(x.day||'—')}-е числа</div><label class="small check-line"><input type="checkbox" ${x.included_in_statement?'checked':''} onchange="included('${x.id}',this.checked)"> В выписке</label>`:''}${x.date?`<div class="small">${esc(x.date)} · ${esc(x.type||'Запланировано')}</div>`:''}</span><div class="field" id="item-${x.id}"><b class="money display">${fmt(x.amount)}</b><input class="edit" type="number" step="0.01" value="${x.amount}" onblur="commitItem('${collection}','${x.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="icon" onclick="editItem('${x.id}')">✎</button>${['planned','holidays'].includes(collection)?`<button class="icon" title="Изменить название и дату" onclick="editRecord('${collection}','${x.id}')">⋯</button>`:''}<button class="icon danger" onclick="removeItem('${collection}','${x.id}')">×</button></div></div>`}
function scratch(){const key='salary-'+scratchCounter++;const stage=scratchStates[key]||0;return `<span class="salary-group"><button class="scratch stage${stage}" aria-label="Защитное покрытие зарплаты" onclick="scratchTap('${key}')"><span class="salary-value">${stage===3?fmt(d.salary):stage?'<span aria-hidden="true">'+fmt(d.salary)+'</span>':'••••••'}</span><span class="coating"></span></button><button class="icon pencil" title="Изменить зарплату" aria-label="Изменить зарплату" onclick="salaryEditTap('${key}')">✎</button></span>`}
function render(){pay='Ашрай';scratchCounter=0;const spent=expenses();const progress=Math.max(0,Math.min(100,100*(Number(d.balance)+Number(d.salary)-spent-Number(d.limit))/Math.max(1,Number(d.salary))));document.getElementById('app').innerHTML=`${!d.initialized?welcomeHTML():''}
<section class="card"><div class="top-summary"><h2>▣ Цель экономии — ${monthName()}</h2><span class="chip">${esc(d.statementStatus)}</span></div><div class="sub">${periodLabel()} · Цель: баланс не ниже ${fmt(d.limit)}</div><div class="grid" style="margin-top:17px"><div><div class="sub">Текущий баланс банка</div><div class="big">${fmt(d.balance)}</div></div><div><div class="sub">Аренда + ${d.loanActive?'платёж по кредиту':'кредит отсутствует'}</div><div class="big">${fmt(Number(d.rent)+(d.loanActive?Number(d.loan):0))}</div></div><div><div class="sub">Зарплата · ${prettyDate(d.salaryDate)}</div><div style="margin-top:7px">${scratch()}</div></div><div><div class="sub">Расчётный запас до цели</div><div class="big ${free()>=0?'green':'red'}">${fmt(free())}</div></div></div><div class="progress"><div style="width:${progress}%"></div></div><div class="row small"><span>Новые покупки: ${fmt(purchasesCash()+purchasesCard())}</span><span class="green">Запас: ${fmt(free())}</span></div><div class="line"></div>${item('Прогноз после всех резервов',forecast(),forecast()>=0?'green':'red')}${item('Целевой предел минуса',d.limit)}<div class="note">Это расчёт по известным статьям, а не подтверждённая доступная сумма. Состав полного credit требует сверки. Спорные статьи отмечаются отдельно.</div></section>
<section class="card"><div class="top-summary"><h2>⚙ Цель экономии</h2><button class="icon" onclick="showSettings()">☷</button></div><div class="sub">Расчётный период ${periodLabel()}</div><div class="row"><span>Ожидаемая зарплата</span><div class="field">${scratch()}</div></div></section>
${section('cibus','♜ Cibus',`${numeric('cibusDays','Рабочих дней за период')}${numeric('cibus50','Ваучеры по 50 ₪ · дней')}${numeric('cibusOrdinary','Обычные обеды · дней')}${editable('cibusLunchShare','Личное участие за обед')}<div class="line"></div>${item('40 ₪: '+CashModel.cibus(d).n40+' × 2 ₪',CashModel.cibus(d).n40*2)}${item('50 ₪: '+CashModel.cibus(d).n50+' × 12 ₪',CashModel.cibus(d).n50*12)}${item('Обеды: '+CashModel.cibus(d).ordinary+' × '+fmt(d.cibusLunchShare),CashModel.cibus(d).ordinary*d.cibusLunchShare)}<div class="gray">${item('Моё участие Cibus',cibus())}</div><label class="small"><input type="checkbox" ${d.cibusIncluded?'checked':''} onchange="d.cibusIncluded=this.checked;save();render()"> Уже входит в сумму выписки</label>`,fmt(cibus()))}
${section('child','♧ Алименты и '+esc(d.childName||'ребёнок'),childHTML(),fmt(child()))}
${section('subs','↻ Ежемесячные абонплаты',`<details class="help"><summary>Как работает «В выписке»?</summary>Отмечено — платёж уже внутри общей суммы credit, отдельно не вычитается. Без отметки — добавляется к расходам сверх выписки. Приход денег не создаётся.</details>${d.subs.map(x=>editableItem('subs',x)).join('')}<button class="compact" onclick="addItem('subs')">＋ Добавить абонплату</button><div class="line"></div>${item('Всего абонплат',totalSub())}`,fmt(totalSub()))}
${section('installments','▤ Рассрочки и будущие списания',installmentsHTML(),fmt(sum(d.installments.filter(x=>x.active&&x.status==='Подтверждено').map(x=>({amount:x.amount_per_payment})))))}

${section('purchases','🛒 Журнал новых покупок',`<div class="form-row"><label>Что куплено / магазин</label><div class="field"><input id="shop" style="flex:1;width:100%" placeholder="Например, продукты в Шуферсаль" oninput="suggest(this.value)"><button class="photo-button" onclick="selectReceipt(false)" title="Галерея" aria-label="Галерея">${uiIcon('gallery')}</button><button class="photo-button" onclick="selectReceipt(true)" title="Камера" aria-label="Камера">${uiIcon('camera')}</button><input id="receiptFile" type="file" accept="image/*" hidden onchange="attachReceipt(this.files[0])"></div><div id="receiptNotice" class="small"></div><div id="suggestions" class="suggestions"></div></div><div class="two"><div class="form-row"><label>Сумма, ₪</label><input id="amount" type="number" step="0.01" placeholder="0,00"></div><div class="form-row"><label>Дата покупки</label><input id="date" type="date" value="${TODAY()}"></div></div><div class="form-row"><label>Категория</label><button id="categoryChoice" class="compact" onclick="categoryTap()">Выбери категорию</button><select id="category" hidden onchange="categorySelected()"><option value="">Выбери категорию</option>${['Продукты','Рестораны','Развлечения','Дети','Дом','Одежда','Транспорт','Ненужные покупки','Здоровье','Другое'].map(x=>`<option>${x}</option>`).join('')}</select><input id="customCategory" hidden style="margin-top:6px" placeholder="Или введи свою категорию"></div><div class="form-row"><label>Способ оплаты</label><div class="actions"><button id="pay-card" class="primary compact" onclick="choosePay('Ашрай')">credit</button><button id="pay-cash" class="compact" onclick="choosePay('Счёт')">debit</button></div></div><div class="form-row"><label>Статус</label>${statusPicker('status','Совершено',true)}</div><button class="primary" style="width:100%" onclick="addPurchase()">＋ Добавить покупку</button><div class="line"></div><div class="row"><b>Покупки</b><button class="compact" onclick="toggle('report')">${d.open.report?'Свернуть':'Открыть лог-отчёт'}</button></div>${d.open.report?'<div class="report-scroll">'+reportHTML()+'</div>':''}`,fmt(purchasesCash()+purchasesCard()))}

<div class="gray obligation">${editable('rent','Аренда')}${dateField('rentDate','Дата списания аренды')}</div>${item('Алименты и ребёнок',-child())}${item('Cibus',-cibus())}${item('Абонплаты · детализация',-totalSub())}<div class="small">Статьи с отметкой «в выписке» повторно не вычитаются. Итог по постатейной сверке ниже.</div>${item('Праздники и покупки',-holiday())}${item('Запланированные',-planned())}${item('Новые покупки · credit',-purchasesCard())}${item('Новые покупки · debit',-purchasesCash())}${item('Резерв',-d.reserve)}<div class="line"></div>${item('Прогноз после расходов',forecast(),forecast()>=0?'green':'red')}${item('Баланс при использовании целевого лимита',d.limit)}<div class="gray">${item('Запас до целевого предела',free(),free()>=0?'green':'red')}</div><div class="small">Расчётная версия. Полноту выписки и спорные статьи необходимо сверить. Подписки и Cibus — прогноз сверх выписки, пока не отмечены включёнными.</div>`,fmt(forecast()))}

function reportHTML(){let cats={};for(let x of CashModel.unique(d.purchases).filter(x=>CashModel.inPeriod(d,x.date))){(cats[x.category||'Другое']??=[]).push(x)}return `<div class="actions"><button class="compact" onclick="document.querySelectorAll('.cat').forEach(x=>x.open=true)">Развернуть все</button><button class="compact" onclick="document.querySelectorAll('.cat').forEach(x=>x.open=false)">Свернуть все</button></div><div class="gray">${item('Обязательные платежи',Number(d.rent)+(d.loanActive?Number(d.loan):0))}${item('Алименты и ребёнок',child())}${item('Абонплаты',totalSub())}</div>${Object.entries(cats).map(([name,items])=>`<details class="cat"><summary><b>${esc(name)} · ${fmt(sum(items))}</b></summary>${items.map(x=>`<div class="purchase row"><span>${esc(x.name)}<div class="small">${esc(x.date)} · ${esc(methodLabel(x.method))} · ${esc(x.status)}</div>${x.attachment?`<button class="compact" onclick="viewReceipt('${x.id}')">Чек</button>`:''}</span><div class="field"><b>${fmt(x.amount)}</b><button class="icon" onclick="editPurchase('${x.id}')">✎</button><button class="icon danger" onclick="removeItem('purchases','${x.id}')">×</button></div></div>`).join('')}</details>`).join('')||'<div class="empty">Покупок пока нет</div>'}`}
function toggle(k){d.open[k]=!d.open[k];save();render()}function set(k,v){d[k]=typeof d[k]==='boolean'?Boolean(v):Number(v)||0;save();render()}function edit(k){const e=document.getElementById('field-'+k);if(!e)return;e.classList.add('editing');e.querySelector('input')?.focus()}function commit(k,v){const n=Number(v);if(!Number.isFinite(n)||(!['limit','balance'].includes(k)&&n<0)){render();return}d[k]=n;if(k.startsWith('cibus')){const c=CashModel.cibus(d);d.cibusDays=c.days;d.cibus50=c.n50;d.cibusOrdinary=c.ordinary;}save();render()}function editItem(id){const e=document.getElementById('item-'+id);e.classList.add('editing');e.querySelector('input').focus()}function commitItem(c,id,v){if(!Number.isFinite(Number(v))||Number(v)<0){render();return}let x=d[c].find(x=>x.id===id);if(x)x.amount=Number(v)||0;save();render()}function removeItem(c,id){confirmSmall('Удалить запись?',()=>{d[c]=d[c].filter(x=>x.id!==id);save();render()})}function addItem(c){const names={extra:'Дополнительный расход',subs:'Абонплата',holidays:'Праздничная покупка',planned:'Запланированная покупка'};let opts=c==='holidays'?`<select id="modalType"><option>День рождения</option><option>Новый год</option><option>Особая дата</option><option>Другое</option></select>`:'';modal(`<h3>${names[c]}</h3>${opts}<div class="form-row"><label>Название</label><input id="modalName" placeholder="Название" style="width:100%"></div><div class="form-row"><label>Сумма, ₪</label><input id="modalAmount" type="number" value="0" style="width:100%"></div>${['planned','holidays'].includes(c)?`<div class="form-row"><label>Дата</label><input type="date" id="modalDate" value="${TODAY()}"></div>`:''}<div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="saveItem('${c}')">Добавить</button></div>`)}function saveItem(c){if(!(Number(document.getElementById('modalAmount').value)>=0)||!Number.isFinite(Number(document.getElementById('modalAmount').value)))return;const name=document.getElementById('modalName').value.trim()||document.getElementById('modalType')?.value||'Без названия';d[c].push({id:id(),name,amount:Number(document.getElementById('modalAmount').value)||0,date:document.getElementById('modalDate')?.value,type:document.getElementById('modalType')?.value,source:'Ручной ввод',included_in_statement:false});save();closeModal();render()}function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function confirmSmall(title,yes){window._confirm=yes;modal(`<h3>${title}</h3><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="closeModal();window._confirm()">Подтвердить</button></div>`)}let pay='Ашрай';function choosePay(v){if(v==='Счёт'){confirmSmall('Подтвердить оплату со счёта?',()=>{pay=v;document.getElementById('pay-cash').classList.add('primary');document.getElementById('pay-card').classList.remove('primary')})}else{pay=v;document.getElementById('pay-card').classList.add('primary');document.getElementById('pay-cash').classList.remove('primary')}}const shops=['Шуферсаль','Shufersal','Tiv Taam','Тив Таам','TIFF','Super-Pharm','Супер-Фарм','Rami Levy','Рами Леви','Victory','Виктори','Yochananof','Йохананоф','AM:PM','Арома','Aroma','Макдональдс','McDonald’s','KSP','IKEA','Икеа','Fox','H&M','ZARA','BESTEC','Gold Love'];function suggest(v){let q=v.toLowerCase().trim();document.getElementById('suggestions').innerHTML=q?shops.filter(x=>x.toLowerCase().includes(q)||q==='тив'&&x==='Tiv Taam').slice(0,5).map(x=>`<button onclick="document.getElementById('shop').value='${x}';suggest('')">${x}</button>`).join(''):''}function addPurchase(){const name=document.getElementById('shop').value.trim(),amount=Number(document.getElementById('amount').value),date=document.getElementById('date').value,category=document.getElementById('customCategory').value.trim()||document.getElementById('category').value,status=document.getElementById('status').value;if(!name||!(amount>0)||!Number.isFinite(amount)||!date||!category){modal('<h3>Заполни название, сумму и категорию</h3><button onclick="closeModal()">Закрыть</button>');return}const entry={id:id(),name,amount,date,category,method:pay,status,attachment:draftAttachment,source:'Ручной ввод',included_in_statement:pay==='Ашрай'&&['Включено в выписку','Списано со счёта'].includes(status),charge_date:CashModel.chargeDate({date,method:pay},d)};if(status==='Запланировано')d.planned.push(entry);else d.purchases.push(entry);draftAttachment=null;save();render()}function scratchTap(key){scratchStates[key]=((scratchStates[key]||0)+1)%4;render()}const editTaps={};function salaryEditTap(key){const now=Date.now();if(!editTaps[key]||now-editTaps[key]>1800){editTaps[key]=now;return}editTaps[key]=0;confirmSmall('Открыть редактирование зарплаты?',()=>modal(`<h3>Изменить ожидаемую зарплату</h3><input id="newSalary" type="number" style="width:100%" value="${d.salary}"><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="saveSalary()">Сохранить</button></div>`))}function testImpact(){let v=Math.max(0,Number(document.getElementById('testCost').value)||0);testValue=v;document.getElementById('impact').innerHTML=`Запас после покупки: <b class="${free()-v>=0?'green':'red'}">${fmt(free()-v)}</b><div class="small">Изменение прогноза: −${fmt(v)}</div>`}function resetPanel(){modal(`<h3>Настройки расчёта</h3><div class="small">Сброс изменяет исходные параметры. Покупки и журнал остаются без изменений.</div><div class="form-row"><label>Зарплата, ₪</label><input type="number" id="resetSalary" value="${d.initial_parameters?.salary??0}" style="width:100%"></div><div class="form-row"><label>Целевой минус, ₪</label><input type="number" id="resetLimit" value="${d.initial_parameters?.limit??0}" style="width:100%"></div><div class="form-row"><label>Компенсация за иврит, ₪</label><input type="number" id="resetHebrew" value="${d.initial_parameters?.hebrewOffset??0}" style="width:100%"></div><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="compact danger" onclick="resetConfirm()">Сбросить параметры</button></div>`)}function resetConfirm(){const a=Number(document.getElementById('resetSalary').value),b=Number(document.getElementById('resetLimit').value),c=Number(document.getElementById('resetHebrew').value);confirmSmall('Подтвердить сброс выбранных параметров?',()=>{const old={salary:d.salary,limit:d.limit,hebrewOffset:d.hebrewOffset};d.lastReset=old;if(![a,b,c].every(Number.isFinite)||a<0||c<0)return;d.salary=a;d.limit=b;d.hebrewOffset=c;d.salaryStep=0;save();render();modal(`<h3>Параметры обновлены</h3><div class="small">Можно отменить последний сброс.</div><div class="actions"><button class="compact" onclick="closeModal()">Закрыть</button><button class="primary compact" onclick="d.salary=${old.salary};d.limit=${old.limit};d.hebrewOffset=${old.hebrewOffset};save();closeModal();render()">Отменить сброс</button></div>`)})}
function prettyDate(value){return new Date(value+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function monthName(){return new Date(d.periodEnd+'T12:00:00').toLocaleDateString('ru-RU',{month:'long'})}
function periodLabel(){return [d.periodStart,d.periodEnd].map(x=>x.split('-').reverse().join('.')).join('–')}
function numeric(key,label){return editable(key,label).replace(fmt(d[key])+'</b>',String(d[key])+'</b>')}
function dateField(key,label){return `<div class="row"><span>${label}</span><span class="field"><b class="small">${esc(d[key])}</b><button class="icon" onclick="editDate('${key}')">✎</button></span></div>`}
function editDate(key){modal(`<h3>Изменить дату</h3><input type="date" id="newDate" value="${esc(d[key])}"><div class="actions"><button onclick="closeModal()">Отмена</button><button onclick="saveDate('${key}')">Сохранить</button></div>`)}
function saveDate(key){const date=document.getElementById('newDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;if(key==='periodStart'&&date>=d.periodEnd||key==='periodEnd'&&date<=d.periodStart)return;d[key]=date;save();closeModal();render()}
function included(key,value){d.subs.find(x=>x.id===key).included_in_statement=value;save();render()}
function installmentsHTML(){return `<details class="help"><summary>Зачем две отметки?</summary><p>«Учитывать» включает платёж в прогноз. «Входит в выписку» означает, что он уже внутри общей суммы credit: отдельное списание равно нулю.</p><p>Включён + вне выписки → расход сверх неё. Включён + в выписке → только в составе выписки. Выключен → строка не добавляет расход. Общая сумма выписки при этом не меняется.</p></details>${d.installments.map(x=>`<div class="purchase"><div class="row"><span><b>${esc(x.merchant)}</b><div class="small">${x.payment_index} из ${x.payment_count} · ${esc(x.expected_charge_date)}</div></span><span class="field"><b class="money">${fmt(x.amount_per_payment)}</b><button class="icon" onclick="editInstallment('${x.id}')">✎</button></span></div><div class="small">${esc(x.status)} · ${esc(x.source)}<br>После этого платежа: ${Math.max(0,x.payment_count-x.payment_index)} × ${fmt(x.amount_per_payment)} = ${fmt(CashModel.remaining(x))}</div><label class="small check-line"><input type="checkbox" ${x.included_in_statement?'checked':''} onchange="setInstallment('${x.id}','included_in_statement',this.checked)"> Входит в сумму выписки</label> <label class="small"><input type="checkbox" ${x.active?'checked':''} onchange="setInstallment('${x.id}','active',this.checked)"> Учитывать</label></div>`).join('')}<button class="compact" onclick="editInstallment()">＋ Добавить рассрочку</button>`}
function setInstallment(key,field,value){d.installments.find(x=>x.id===key)[field]=value;save();render()}
function editInstallment(key){let x=d.installments.find(x=>x.id===key)||{merchant:'',amount_per_payment:0,payment_index:1,payment_count:1,expected_charge_date:d.statementDate,status:'Требует сверки'};modal(`<h3>Рассрочка</h3><div class="form-row"><label>Продавец</label><input id="instMerchant" value="${esc(x.merchant)}"></div><div class="form-row"><label>Платёж, ₪</label><input id="instAmount" type="number" min="0" step=".01" value="${x.amount_per_payment}"></div><div class="two"><div class="form-row"><label>Номер платежа</label><input id="instIndex" type="number" min="1" value="${x.payment_index}"></div><div class="form-row"><label>Всего платежей</label><input id="instCount" type="number" min="1" value="${x.payment_count}"></div></div><div class="form-row"><label>Дата списания</label><input id="instDate" type="date" value="${x.expected_charge_date}"></div><div class="form-row"><label>Статус</label><select id="instStatus"><option ${x.status==='Требует сверки'?'selected':''}>Требует сверки</option><option ${x.status==='Подтверждено'?'selected':''}>Подтверждено</option></select></div><div class="actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="saveInstallment('${key||''}')">Сохранить</button></div>`)}
function saveInstallment(key){let merchant=document.getElementById('instMerchant').value.trim(),amount=Number(document.getElementById('instAmount').value),index=Number(document.getElementById('instIndex').value),count=Number(document.getElementById('instCount').value),date=document.getElementById('instDate').value;if(!merchant||amount<0||!Number.isFinite(amount)||!Number.isInteger(index)||!Number.isInteger(count)||index<1||count<index||!date)return;let x=d.installments.find(x=>x.id===key);if(!x){x={id:id(),active:true,included_in_statement:false,source:'Ручной ввод'};d.installments.push(x)}Object.assign(x,{merchant,amount_per_payment:amount,payment_index:index,payment_count:count,expected_charge_date:date,status:document.getElementById('instStatus').value});save();closeModal();render()}
function reconciliationHTML(){const c=CashModel.calculate(d);return `<div class="small">Расчётная версия. Проверяйте полноту выписки, даты и отметки включения. Баланс относится к дате снимка. Уже списанный credit не вычитается повторно.</div><div class="table-scroll"><table><thead><tr><th>Статья</th><th>Сумма</th><th>Источник</th><th>Инструмент</th><th>Дата операции</th><th>Дата списания</th><th>Уже учтена / вне периода?</th><th>Статус</th></tr></thead><tbody>${c.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.amount)}</td><td>${esc(x.source)}</td><td>${esc(methodLabel(x.method))}</td><td>${esc(x.operation_date)}</td><td>${esc(x.date)}</td><td>${x.included?'Да · повторно 0,00 ₪':'Нет · учесть'}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>${item('Прогноз по выбранным статьям',c.forecast)}${item('Запас до цели · расчётная версия',c.free)}${d.reconciliation_notes?`<details class="gray"><summary>Сверка исходного пакета</summary><div class="reconciliation-notes">${esc(d.reconciliation_notes)}</div></details>`:''}<button class="compact" onclick="exportLedger()">Скачать сверку CSV</button>`}

function chartHTML(){let selected=d.history.filter(x=>d.selectedPeriods.includes(x.id)),colors=['#15825a','#4f75ae','#b16b30'];const saving=CashModel.saving(d);return `<div class="small">Дневных операций нет. На графике показаны только известные итоги на конец периода, без выдуманных кривых.</div><div class="actions">${d.history.map(x=>`<button class="compact ${d.selectedPeriods.includes(x.id)?'primary':''}" onclick="togglePeriod('${x.id}')">${esc(x.name)}</button>`).join('')}</div><svg viewBox="0 0 340 180" role="img" aria-label="Известные итоги периодов"><path d="M35 15V145H320" stroke="#bbb" fill="none"/><text x="35" y="169" font-size="11">15-е · начало</text><text x="240" y="169" font-size="11">15-е · конец</text>${selected.map((x,i)=>`<circle cx="${275+i*14}" cy="${140-Number(x.total)/8000*110}" r="5" fill="${colors[i]}"/><text x="42" y="${22+i*20}" fill="${colors[i]}" font-size="12">${esc(x.name)}: ${fmt(x.total)}</text>`).join('')}</svg>${selected.length===2?item('Разница выбранных итогов',selected[1].total-selected[0].total):'<div class="small">Выберите два периода для сравнения.</div>'}<div class="gray">${editable('previousSpending','Траты сравнительного периода')}${editable('savingGoal','Цель сокращения трат')}${editable('comparedSpending','Сценарий трат · требует сверки')}${item('Предел расходов',saving.ceiling)}${item('Превышение',saving.excess,'red')}${item('Требуемая экономия следующего периода',saving.nextGoal)}<button class="compact" onclick="carryExcess()">Перенести превышение в следующий период</button></div>`}
function togglePeriod(key){d.selectedPeriods=d.selectedPeriods.includes(key)?d.selectedPeriods.filter(x=>x!==key):[...d.selectedPeriods,key];save();render()}
function carryExcess(){confirmSmall('Сохранить перенос для следующего периода?',()=>{d.nextPeriodCarry=CashModel.saving(d).excess;save();modal(`<h3>Перенос сохранён</h3><p>При открытии следующего периода требуемая экономия увеличится на ${fmt(d.nextPeriodCarry)}.</p><button onclick="closeModal()">Закрыть</button>`)})}
function download(name,type,contents){const url=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportData(){await Storage.flush();download('Save-Cash-backup-'+TODAY()+'.json','application/json',JSON.stringify({app:'Save Cash',schemaVersion:2,exportedAt:new Date().toISOString(),data:d},null,2))}
function exportLedger(){const rows=CashModel.calculate(d).rows;const cells=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('Save-Cash-reconciliation.csv','text/csv;charset=utf-8','\ufeff'+[['Статья','Сумма ₪','Источник','Инструмент','Дата операции','Дата списания','Учтена / вне периода','Статус'],...rows.map(x=>[x.name,x.amount,x.source,x.method,x.operation_date,x.date,x.included?'Да':'Нет',x.status])].map(r=>r.map(cells).join(';')).join('\r\n'))}
function validData(raw){const v=raw?.data||raw;if(!v||v.schemaVersion!==2||!Array.isArray(v.purchases)||!Array.isArray(v.subs)||!Array.isArray(v.installments))throw new Error('Нужна резервная копия Save Cash v2');for(const key of ['balance','salary','limit','rent','loan','statementTotal'])if(typeof v[key]!=='number'||!Number.isFinite(v[key]))throw new Error('Некорректное число '+key);const out=CashModel.migrate(v);for(const key of ['purchases','subs','installments','extra','planned','holidays','audit_log','history','lessonBills']){if(!Array.isArray(out[key]))throw new Error('Некорректный список '+key);const ids=new Set;for(const x of out[key]){if(!x||typeof x.id!=='string'||!/^[\w-]+$/.test(x.id)||ids.has(x.id))throw new Error('Некорректный или повторный ID');ids.add(x.id);const amount=x.amount??x.amount_per_payment;if(amount!==undefined&&(typeof amount!=='number'||!Number.isFinite(amount)||amount<0))throw new Error('Некорректная сумма')}}validateLessons(out.lessonBills);return out}
async function importData(file){if(!file)return;try{const raw=JSON.parse(await file.text());if(raw.type==='save-cash-lesson-update'){await importLessonUpdate(raw);return}const v=validData(raw);confirmSmall('Восстановить данные из копии? Текущие данные сохранятся в резервной копии.',async()=>{try{await Storage.flush();await Storage.backup('before-import',d);await exportData();d=v;d.initialized=true;save();closeModal();render()}catch(e){storageError(e)}})}catch(e){modal('<h3>Импорт не выполнен</h3><p>'+esc(e.message)+'</p><button onclick="closeModal()">Закрыть</button>')}}
function showSettings(){modal(`<div class="settings-head"><div><h3>Save Cash <span class="pill">v2.2.0</span></h3><div class="small">Бюджет до ЗП · личное использование</div></div><button class="close-button" onclick="closeModal()" aria-label="Закрыть настройки">×</button></div><div class="settings-status"><span class="status-dot"></span><span>${swRegistration?.active?'Офлайн-режим готов':'Подготавливаем офлайн-режим'}</span></div><div class="settings-group"><button class="settings-row" onclick="installApp()">${uiIcon('phone')}<span>Установить приложение<small>На главный экран Android</small></span><span>›</span></button><button class="settings-row" onclick="checkUpdate()">${uiIcon('refresh')}<span>Проверить обновление</span><span>›</span></button></div><div class="settings-label">Данные и расчёт</div><div class="settings-group"><button class="settings-row" onclick="exportData()">${uiIcon('export')}<span>Резервная копия<small>Экспорт JSON</small></span><span>›</span></button><button class="settings-row" onclick="document.getElementById('restoreFile').click()">${uiIcon('folder')}<span>Загрузить JSON<small>Копия или обновление счетов за уроки</small></span><span>›</span></button><input id="restoreFile" type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"><button class="settings-row" onclick="showPeriodSettings()">${uiIcon('calendar')}<span>Расчётный период и даты</span><span>›</span></button><button class="settings-row" onclick="resetPanel()">${uiIcon('sliders')}<span>Исходные параметры</span><span>›</span></button>${d.lastReset?'<button class="settings-row" onclick="undoReset()"><span>↶</span><span>Отменить последний сброс</span><span>›</span></button>':''}</div><div class="settings-rights">© 2026 Anton Koval<br>Все права защищены. Для личного использования.</div><div class="small settings-foot">Фото чеков сохраняются с покупкой. Суммы вводятся вручную.</div>`)}
function showPeriodSettings(){modal(`<h3>Период и даты</h3><button class="compact" onclick="openNextPeriod()">Открыть следующий период</button>${dateField('periodStart','Начало периода')}${dateField('periodEnd','Конец периода')}${dateField('balanceDate','Баланс на дату')}${dateField('salaryDate','Зарплата')}${dateField('childDate','Алименты')}<p class="small">Баланс должен включать все уже проведённые списания на указанную дату. Для нового периода обновите баланс, выписку и даты обязательств. Последний кредит не переносится автоматически.</p><button onclick="closeModal()">Закрыть</button>`)}
function openNextPeriod(){confirmSmall('Перейти в следующий период? Текущий снимок будет сохранён. Обновите банковский баланс после перехода.',async()=>{try{await Storage.backup('before-period-change',d);const start=new Date(d.periodEnd+'T12:00:00Z');start.setUTCDate(start.getUTCDate()+1);const end=new Date(d.periodEnd+'T12:00:00Z');end.setUTCMonth(end.getUTCMonth()+1);d.periodStart=start.toISOString().slice(0,10);d.periodEnd=end.toISOString().slice(0,10);d.carry=Number(d.nextPeriodCarry||0);d.nextPeriodCarry=0;d.statementTotal=0;d.statementStatus='Частичная выписка';d.statementDate=d.periodEnd;for(const x of d.subs)x.included_in_statement=false;d.cibusIncluded=false;d.salaryDate=d.periodEnd.slice(0,8)+'07';d.rentDate=d.periodEnd;d.childDate=d.periodEnd.slice(0,8)+'01';d.loanActive=false;for(const x of d.installments)if(x.expected_charge_date<d.periodStart&&x.active){const delta=(+d.periodEnd.slice(0,4)-+x.expected_charge_date.slice(0,4))*12+(+d.periodEnd.slice(5,7)-+x.expected_charge_date.slice(5,7));x.payment_index+=delta;x.expected_charge_date=d.periodEnd;x.included_in_statement=false;if(x.payment_index>x.payment_count){x.active=false;x.payment_index=x.payment_count}}save();closeModal();render()}catch(e){storageError(e)}})}
function undoReset(){Object.assign(d,d.lastReset);delete d.lastReset;save();closeModal();render()}
let swRegistration;let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});async function installApp(){if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else modal('<h3>Установка на Android</h3><p>Откройте опубликованную HTTPS-ссылку в Chrome → ⋮ → «Установить приложение» или «Добавить на главный экран».</p><button onclick="closeModal()">Закрыть</button>')}
async function start(){document.getElementById('app').innerHTML='<section class="card">Открываем ваши данные…</section>';try{const loaded=await Storage.load();if(!Array.isArray(loaded.lessonBills))await Storage.backup('before-v2.2-lessons',loaded);d=CashModel.migrate(loaded);await Storage.save(d);ready=true;render();}catch(e){document.getElementById('app').innerHTML='<section class="card">Не удалось открыть хранилище. Данные не перезаписаны. '+esc(e.message)+'</section>'}}

let categoryClicks=0;
function categoryTap(){const select=document.getElementById('category'),custom=document.getElementById('customCategory');categoryClicks++;if(categoryClicks===1){select.hidden=false;custom.hidden=true;select.focus()}else{select.hidden=true;custom.hidden=false;custom.focus();categoryClicks=0}}
function categorySelected(){const select=document.getElementById('category');document.getElementById('categoryChoice').textContent=select.value||'Выбери категорию';select.hidden=true;categoryClicks=0}
document.addEventListener?.('click',e=>{if(!['category','categoryChoice','customCategory'].includes(e.target.id)){const select=document.getElementById('category');if(select)select.hidden=true;const custom=document.getElementById('customCategory');if(custom)custom.hidden=true;categoryClicks=0}});
function saveSalary(){const n=Number(document.getElementById('newSalary').value);if(!Number.isFinite(n)||n<0)return;d.salary=n;Object.keys(scratchStates).forEach(k=>scratchStates[k]=0);save();closeModal();render()}
function changeStatementStatus(){modal(`<h3>Статус выписки</h3><div class="stack">${['Частичная выписка','Полная выписка · сверена'].map(status=>`<button onclick="setStatementStatus('${status}')">${status}</button>`).join('')}<button onclick="closeModal()">Отмена</button></div><p class="small">При полной выписке отметьте входящие в неё подписки, рассрочки, Cibus и покупки.</p>`)}
async function checkUpdate(){try{if(!swRegistration){modal('<h3>Обновление пока недоступно</h3><p>Нужно открыть приложение по HTTPS и дождаться регистрации офлайн-режима.</p><button onclick="closeModal()">Закрыть</button>');return}await swRegistration.update();if(swRegistration.waiting)confirmSmall('Обновить приложение? Сначала сохраним данные.',async()=>{await Storage.flush();swRegistration.waiting.postMessage('ACTIVATE_UPDATE');window.location.reload()});else modal('<h3>Проверка завершена</h3><p>Если обновление загружается, оно применится при следующем открытии приложения.</p><button onclick="closeModal()">Закрыть</button>')}catch(e){modal('<h3>Не удалось проверить обновление</h3><p>'+esc(e.message)+'</p><button onclick="closeModal()">Закрыть</button>')}}
function setStatementStatus(status){d.statementStatus=status;save();closeModal();render()}
function welcomeHTML(){return '<section class="card welcome"><h2>Добро пожаловать в Save Cash</h2><p class="small">Загрузите свою резервную копию JSON. Данные сохраняются только на этом устройстве и не отправляются на GitHub.</p><label class="compact">Загрузить JSON <input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label><div class="actions"><button class="compact" onclick="d.initialized=true;save();render()">Начать с пустого бюджета</button></div></section>'}
let draftAttachment=null;
function selectReceipt(camera){const input=document.getElementById('receiptFile');if(camera)input.setAttribute('capture','environment');else input.removeAttribute('capture');input.click()}
function attachReceipt(file){if(!file)return;if(!file.type.startsWith('image/')||file.size>3*1024*1024){modal('<h3>Выберите изображение до 3 МБ</h3><button onclick="closeModal()">Закрыть</button>');return}const r=new FileReader();r.onload=()=>{draftAttachment=r.result;document.getElementById('receiptNotice').textContent='Чек прикреплён. Название, дату и сумму заполните вручную.'};r.readAsDataURL(file)}
function viewReceipt(key){const x=d.purchases.find(x=>x.id===key);if(x?.attachment&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(x.attachment))modal('<img class="attachment" src="'+esc(x.attachment)+'" alt="Прикреплённый чек"><button onclick="closeModal()">Закрыть</button>')}
function editRecord(collection,key){const x=d[collection].find(x=>x.id===key);modal(`<h3>Изменить запись</h3><div class="form-row"><label>Название</label><input id="recordName" value="${esc(x.name)}"></div><div class="form-row"><label>Дата</label><input id="recordDate" type="date" value="${esc(x.date||TODAY())}"></div><div class="actions"><button onclick="closeModal()">Отмена</button><button onclick="saveRecord('${collection}','${key}')">Сохранить</button>${collection==='planned'?`<button onclick="payPlanned('${key}')">Покупка совершена</button>`:''}</div>`)}
function saveRecord(collection,key){const x=d[collection].find(x=>x.id===key);x.name=document.getElementById('recordName').value.trim()||x.name;x.date=document.getElementById('recordDate').value||x.date;save();closeModal();render()}
function payPlanned(key){const x=d.planned.find(x=>x.id===key);if(x.transaction_id)return;const transaction={...x,id:id(),category:'Другое',method:'Ашрай',status:'Совершено',source:'Из плана'};x.transaction_id=transaction.id;d.purchases.push(transaction);save();closeModal();render()}
function editPurchase(key){const x=d.purchases.find(x=>x.id===key);modal(`<h3>Покупка</h3><div class="form-row"><label>Название</label><input id="editName" value="${esc(x.name)}"></div><div class="form-row"><label>Сумма</label><input id="editAmount" type="number" value="${x.amount}" step=".01" min="0"></div><div class="form-row"><label>Дата покупки</label><input id="editDate" type="date" value="${esc(x.date)}"></div><div class="form-row"><label>Дата списания</label><input id="editCharge" type="date" value="${esc(CashModel.chargeDate(x,d))}"></div><div class="form-row"><label>Статус</label>${statusPicker('editStatus',x.status,false)}</div><div class="form-row"><label>Связь с рассрочкой, подпиской или уроками</label><select id="editLink"><option value="">Нет</option>${d.installments.map(i=>`<option value="${i.id}" ${x.installment_id===i.id?'selected':''}>${esc(i.merchant)}</option>`).join('')}${d.subs.map(i=>`<option value="${i.id}" ${x.recurring_id===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}${CashModel.lessonPayments(d).map(p=>`<option value="lesson:${p.id}" ${x.lesson_payment_id===p.id?'selected':''}>${esc(p.name)} · ${esc(p.charge_date)} · ${fmt(p.amount)}</option>`).join('')}</select></div><div class="actions"><button onclick="closeModal()">Отмена</button><button onclick="savePurchase('${key}')">Сохранить</button></div>`)}
function savePurchase(key){const x=d.purchases.find(x=>x.id===key),amount=Number(document.getElementById('editAmount').value);if(!Number.isFinite(amount)||amount<=0)return;Object.assign(x,{name:document.getElementById('editName').value.trim()||x.name,amount,date:document.getElementById('editDate').value,charge_date:document.getElementById('editCharge').value,status:document.getElementById('editStatus').value,installment_id:document.getElementById('editLink').value.startsWith('sub-')?'':document.getElementById('editLink').value,recurring_id:document.getElementById('editLink').value.startsWith('sub-')?document.getElementById('editLink').value:''});if(document.getElementById('editLink').value.startsWith('lesson:')){x.lesson_payment_id=document.getElementById('editLink').value.slice(7);x.installment_id='';x.recurring_id=''}else delete x.lesson_payment_id;x.included_in_statement=x.method==='Ашрай'&&['Включено в выписку','Списано со счёта'].includes(x.status);save();closeModal();render()}
function methodLabel(value){return value==='Счёт'?'debit':value==='Ашрай'?'credit':value}
function uiIcon(name){const paths={gallery:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/>',camera:'<path d="M8 6 9.5 3h5L16 6h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>',refresh:'<path d="M20 7a9 9 0 1 0 1 8M20 2v5h-5"/>',export:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6m10-6v6M3 11h18"/>',sliders:'<path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'};return '<svg class="ui-svg" viewBox="0 0 24 24" aria-hidden="true">'+(paths[name]||paths.sliders)+'</svg>'}
function statusPicker(key,current,planned){const values=['Совершено',...(planned?['Запланировано']:[]),'Включено в выписку','Списано со счёта'];return `<input type="hidden" id="${key}" value="${esc(current)}"><details class="status-picker" id="picker-${key}"><summary><span id="label-${key}">${esc(current)}</span><span>⌄</span></summary><div class="status-options">${values.map((v,i)=>`<button type="button" class="${v===current?'selected':''}" onclick="selectStatus('${key}',${i},${!!planned})">${v}</button>`).join('')}</div></details>`}
function selectStatus(key,index,planned){const values=['Совершено',...(planned?['Запланировано']:[]),'Включено в выписку','Списано со счёта'];document.getElementById(key).value=values[index];document.getElementById('label-'+key).textContent=values[index];const picker=document.getElementById('picker-'+key);picker.open=false;picker.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('selected',i===index))}
function childHTML(){const off=CashModel.compensation(d),hebrew=d.lessonBills.filter(x=>x.subject==='hebrew');return `<div class="gray"><h3>Обязательные платежи</h3>${editable('childSupport','Основные алименты')}${dateField('childDate','Дата перевода алиментов')}</div>${lessonAccountHTML('math')}${lessonAccountHTML('hebrew')}<div class="gray"><h3>Компенсационный вычет</h3>${hebrew.length?hebrew.filter(b=>CashModel.inPeriod(d,b.compensation_date)).map(b=>{const shares=CashModel.lessonShares(b.total);return `<div class="row"><span>Иврит · ${esc(b.name)}<div class="lesson-caption">Её доля ${fmt(shares.mother)} · моя ${fmt(shares.father)}<br>Вычет один раз · ${esc(b.compensation_date)}</div></span><b class="money green">−${fmt(shares.mother)}</b></div>`}).join('')||'<div class="small">В этом периоде вычетов за иврит нет.</div>':editable('hebrewOffset','Прежняя ручная компенсация')}${item('Всего вычет из алиментов',-off,'green')}<div class="lesson-caption">Вы платите преподавателю полностью. Доля мамы уменьшает алименты; отдельный приход денег не создаётся.${!hebrew.length?' После добавления счёта за иврит прежнюю ручную сумму заменит автоматический расчёт.':''}</div></div><div class="gray"><div class="row"><h3>Дополнительные расходы</h3><button class="compact" onclick="addItem('extra')" aria-label="Добавить дополнительный расход">＋</button></div>${d.extra.map(x=>editableItem('extra',x)).join('')}${item('Всего дополнительно',sum(d.extra))}</div><div class="gray">${item('Алименты к перечислению',CashModel.alimony(d),'green')}${item('Оплата уроков в периоде',sum(CashModel.lessonPayments(d).filter(p=>CashModel.future(d,p.charge_date))))}${item('К перечислению и оплате',child(),'green')}<div class="lesson-caption">Входящие в выписку уроки учитываются через общую сумму credit. Прошедшие платежи отдельно не вычитаются.</div></div>`}
function lessonAccountHTML(subject){const title=(subject==='hebrew'?'Иврит':'Математика')+' · '+(d.childName||'ребёнок');const bills=d.lessonBills.filter(b=>b.subject===subject);return `<div class="gray"><div class="row"><h3>${esc(title)}</h3><button class="compact" onclick="editLesson('', '${subject}')" aria-label="Добавить счёт: ${esc(title)}">＋</button></div>${subject==='math'?'<div class="lesson-caption">Мои расходы · без компенсации</div>':'<div class="lesson-caption">Моя доля округляется вверх до 100 ₪, с разницей минимум 100 ₪ в мою сторону. Доля мамы — остаток.</div>'}${bills.map(b=>{const share=CashModel.lessonShares(b.total);return `<div class="lesson-bill"><div class="row"><span>${esc(b.name)}${b.lessons?'<div class="small">'+b.lessons+' уроков</div>':''}</span><span class="field"><b class="money">${fmt(b.total)}</b><button class="icon" aria-label="Изменить счёт ${esc(b.name)}" onclick="editLesson('${b.id}','${subject}')">✎</button></span></div>${subject==='hebrew'?`<div class="lesson-caption">(её доля ${fmt(share.mother)}, моя доля ${fmt(share.father)})</div>`:''}${b.payments.map(p=>`<div class="lesson-payment"><span>${esc(p.charge_date)} · ${methodLabel(p.method)}<br>${p.charge_date<=d.balanceDate?'Уже в исходном балансе':p.included_in_statement&&p.method!=='Счёт'?'В сумме выписки · отдельно 0 ₪':CashModel.inPeriod(d,p.charge_date)?'Учтено в прогнозе':'Другой период'}</span><strong>${fmt(p.amount)}</strong></div>`).join('')}</div>`}).join('')||'<div class="empty">Добавьте счёт за уроки</div>'}</div>`}
let lessonDraft;
function editLesson(key,subject){lessonDraft=structuredClone(d.lessonBills.find(b=>b.id===key)||{id:id(),subject,name:'Счёт за уроки',total:0,lessons:0,compensation_date:d.childDate,payments:[{id:id(),amount:0,charge_date:d.statementDate,method:'Ашрай',included_in_statement:false}]});lessonEditor()}
function lessonEditor(){const b=lessonDraft;modal(`<h3>${b.subject==='hebrew'?'Иврит':'Математика'} · счёт</h3><div class="two"><div class="form-row"><label>Название</label><input id="lessonName" value="${esc(b.name)}"></div><div class="form-row"><label>Уроков</label><input id="lessonCount" type="number" min="0" value="${b.lessons||0}"></div></div><div class="form-row"><label>Весь счёт, ₪</label><input id="lessonTotal" type="number" min="0" step=".01" value="${b.total}" oninput="previewShares()"></div><div id="lessonShares" class="lesson-caption"></div>${b.subject==='hebrew'?`<div class="form-row"><label>Дата однократного вычета из алиментов</label><input id="lessonOffsetDate" type="date" value="${esc(b.compensation_date)}"></div>`:''}<h3 style="font-size:14px;margin-top:17px">Платежи преподавателю</h3>${b.payments.map((p,i)=>`<div class="lesson-editor"><div class="two"><div class="form-row"><label>Сумма, ₪</label><input id="lpAmount${i}" type="number" min="0" step=".01" value="${p.amount}"></div><div class="form-row"><label>Дата списания</label><input id="lpDate${i}" type="date" value="${esc(p.charge_date)}"></div></div><div class="row"><span class="small">Способ оплаты</span><select id="lpMethod${i}" style="font-size:12px;padding:6px"><option value="Ашрай" ${p.method==='Ашрай'?'selected':''}>credit</option><option value="Счёт" ${p.method==='Счёт'?'selected':''}>debit</option></select></div><label class="small check-line"><input type="checkbox" id="lpIncluded${i}" ${p.included_in_statement?'checked':''}> Уже входит в сумму выписки credit</label>${b.payments.length>1?`<button class="payment-remove" onclick="removeLessonPayment(${i})">Убрать платёж</button>`:''}</div>`).join('')}<button class="compact" onclick="addLessonPayment()">＋ Ещё платёж</button><p class="small">Сумма платежей должна совпадать со счётом. Дата списания нужна для распределения по периодам. Для debit отметка выписки credit не применяется.</p><div id="lessonError" class="small red"></div><div class="actions"><button class="compact" onclick="closeModal()">Отмена</button><button class="primary compact" onclick="saveLesson()">Сохранить</button></div>`);previewShares()}
function previewShares(){const b=lessonDraft,n=Number(document.getElementById('lessonTotal').value),shares=CashModel.lessonShares(n);document.getElementById('lessonShares').textContent=b.subject==='hebrew'?'Её доля '+fmt(shares.mother)+' · моя доля '+fmt(shares.father):'Полностью мои расходы: '+fmt(n)}
function syncLessonDraft(){Object.assign(lessonDraft,{name:document.getElementById('lessonName').value.trim()||'Счёт за уроки',total:Number(document.getElementById('lessonTotal').value),lessons:Number(document.getElementById('lessonCount').value)||0,compensation_date:document.getElementById('lessonOffsetDate')?.value||lessonDraft.compensation_date});lessonDraft.payments.forEach((p,i)=>Object.assign(p,{amount:Number(document.getElementById('lpAmount'+i).value),charge_date:document.getElementById('lpDate'+i).value,method:document.getElementById('lpMethod'+i).value,included_in_statement:document.getElementById('lpIncluded'+i).checked}))}
function addLessonPayment(){syncLessonDraft();lessonDraft.payments.push({id:id(),amount:Math.max(0,lessonDraft.total-sum(lessonDraft.payments)),charge_date:d.statementDate,method:'Ашрай',included_in_statement:false});lessonEditor()}
function removeLessonPayment(i){syncLessonDraft();lessonDraft.payments.splice(i,1);lessonEditor()}
function validateLessons(bills){if(!Array.isArray(bills))throw Error('Некорректные счета за уроки');const ids=new Set,validDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;for(const b of bills){if(!b||!['hebrew','math'].includes(b.subject)||typeof b.name!=='string'||!Number.isFinite(b.total)||b.total<0||!Array.isArray(b.payments)||!b.payments.length||!validDate(b.compensation_date)||!b.id||! /^[\w-]+$/.test(b.id)||ids.has(b.id))throw Error('Проверьте сумму, название и дату счёта');ids.add(b.id);if(CashModel.cents(sum(b.payments))!==CashModel.cents(b.total))throw Error('Сумма платежей не совпадает с общей суммой счёта');for(const p of b.payments){if(!p||!p.id||!/^[\w-]+$/.test(p.id)||ids.has(p.id)||!Number.isFinite(p.amount)||p.amount<0||!validDate(p.charge_date)||!['Ашрай','Счёт'].includes(p.method)||typeof p.included_in_statement!=='boolean')throw Error('Проверьте платежи и даты списания');ids.add(p.id)}}}
function saveLesson(){syncLessonDraft();try{const bills=d.lessonBills.filter(b=>b.id!==lessonDraft.id).concat(lessonDraft);validateLessons(bills);d.lessonBills=bills;save();closeModal();render()}catch(e){document.getElementById('lessonError').textContent=e.message}}
async function importLessonUpdate(raw){if(raw.app!=='Save Cash'||raw.version!==1)throw Error('Неизвестный формат обновления');validateLessons(raw.lessonBills);const bills=structuredClone(d.lessonBills);for(const b of raw.lessonBills){const i=bills.findIndex(x=>x.id===b.id);if(i>=0)bills[i]=b;else bills.push(b)}validateLessons(bills);confirmSmall('Добавить счета за уроки? Покупки, баланс и остальные данные сохранятся.',async()=>{await Storage.flush();await Storage.backup('before-lesson-update',d);d.lessonBills=bills;if(typeof raw.childName==='string')d.childName=raw.childName;save();closeModal();render()})}
function calculationRows(){if(!Array.isArray(d.calculations)||!d.calculations.length)d.calculations=[{id:id(),terms:[0]}];return d.calculations}
function calcTotal(){return calculationRows().reduce((s,r)=>s+r.terms.reduce((a,n)=>a+CashModel.cents(n),0),0)/100}
function calculatorHTML(){const total=calcTotal();return `<div class="calculator"><h3>Проверка покупки + калькулятор</h3><div class="small">Нажмите на число: откроется цифровая панель. «＋» добавляет слагаемое или ещё один расчёт.</div>${calculationRows().map((r,i)=>`<div class="calc-row"><div class="calc-expression">${r.terms.map((n,j)=>`${j?'<span class="small">+</span>':''}<button class="calc-number" onclick="openKeypad(${i},${j})" aria-label="Расчёт ${i+1}, число ${j+1}">${fmt(n).replace(' ₪','')}</button>`).join('')}<button class="calc-add" onclick="appendTerm(${i})" aria-label="Добавить число в расчёт ${i+1}">＋</button></div><div class="calc-result"><span>= ${fmt(r.terms.reduce((a,n)=>a+CashModel.cents(n),0)/100)}</span>${calculationRows().length>1?`<button onclick="removeCalculation(${i})">Убрать</button>`:''}</div></div>`).join('')}<button class="compact calc-plus" onclick="addCalculation()">＋ Ещё расчёт</button><div class="gray calc-impact">Итого проверяем: <b>${fmt(total)}</b><br>Запас после покупки: <strong class="${free()-total>=0?'green':'red'}">${fmt(free()-total)}</strong></div><div class="small">Это примерка расходов. В журнал покупки не записываются.</div></div>`}
function addCalculation(){calculationRows().push({id:id(),terms:[0]});save();render()}
function removeCalculation(i){calculationRows().splice(i,1);save();render()}
function appendTerm(i){calculationRows()[i].terms.push(0);openKeypad(i,calculationRows()[i].terms.length-1)}
let keypadState;
function openKeypad(row,index){keypadState={row,index,value:String(calculationRows()[row].terms[index]||0)};modal(`<h3>Число для расчёта</h3><div id="keypadValue" class="keypad-value">${esc(keypadState.value.replace('.',','))}</div><div class="keypad">${['7','8','9','⌫','4','5','6','C','1','2','3','+','0',',','00','✓'].map(v=>`<button class="${v==='✓'?'primary':''}" onclick="keypadPress('${v}')" aria-label="${v==='⌫'?'Удалить цифру':v==='✓'?'Записать число':v==='C'?'Очистить число':v}">${v}</button>`).join('')}</div><div class="keypad-actions"><button class="compact" onclick="closeModal();render()">Отмена</button><button class="compact" onclick="keypadPress('✓')">Записать</button></div>`)}
function keypadPress(key){const k=keypadState;if(key==='✓'||key==='+'){const n=Number(k.value);if(!Number.isFinite(n)||n<0)return;calculationRows()[k.row].terms[k.index]=n;save();if(key==='+'){calculationRows()[k.row].terms.push(0);openKeypad(k.row,calculationRows()[k.row].terms.length-1)}else{closeModal();render()}return}if(key==='C')k.value='0';else if(key==='⌫')k.value=k.value.slice(0,-1)||'0';else if(key===','){if(!k.value.includes('.'))k.value+='.'}else if(k.value.length<12&&(!k.value.includes('.')||k.value.split('.')[1].length<2)){k.value=k.value==='0'?key:k.value+key}document.getElementById('keypadValue').textContent=k.value.replace('.',',')}


start();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").then(r=>swRegistration=r).catch(e=>{const n=document.getElementById("storage-state");if(n)n.textContent="Офлайн-режим недоступен: "+e.message}))}</script></body></html>
