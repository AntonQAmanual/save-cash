<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save Cash — проверка ширины</title><style>body{font:14px system-ui;margin:12px;background:#ddd}main{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}article{background:white;padding:6px}iframe{height:740px;border:1px solid #aaa;display:block}output{display:block;padding:8px;max-width:420px;overflow-wrap:anywhere}</style><h1>Save Cash · 320 / 360 / 430 px</h1><p>Проверка вёрстки. Личные данные читаются только из локального хранилища этого браузера.</p><main><article><h2>320 px</h2><iframe title="Save Cash 320" width="320" src="./index.html"></iframe><output></output></article><article><h2>360 px</h2><iframe title="Save Cash 360" width="360" src="./index.html"></iframe><output></output></article><article><h2>430 px</h2><iframe title="Save Cash 430" width="430" src="./index.html"></iframe><output></output></article></main><script>const check=()=>{for(const frame of document.querySelectorAll('iframe')){try{const doc=frame.contentDocument;if(!doc.getElementById('app').children.length)continue;const width=doc.documentElement.clientWidth;const overflow=[...doc.querySelectorAll('#app *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.right>width+1&&!e.closest('.table-scroll')});frame.nextElementSibling.textContent=doc.documentElement.scrollWidth<=width?'Ширина страницы: OK':'Переполнение страницы: '+doc.documentElement.scrollWidth+' > '+width;frame.nextElementSibling.textContent+=' · элементов за границей: '+overflow.length;}catch(e){frame.nextElementSibling.textContent=e.message}}};document.querySelectorAll('iframe').forEach(f=>f.onload=()=>setTimeout(check,500));setTimeout(check,2000);</script></html>
